assets: "/images/talks/understanding-bottleneck"
sections:
  - title:
    segments:
      - slide: slide-01.webp
        alt: "Title slide: Understanding is the new bottleneck. Geoffrey Litt, Design Engineer at Notion."
        html: |
          <p><strong>Hot take: I think it's still important to understand the code that our agents write!</strong></p>
          <p>In this talk I'll explain why that's the case, and show some ideas for how to efficiently understand code. Alright, let's dive in.</p>
      - slide: slide-02.webp
        alt: "Cartoon of a person surrounded by a growing pile of agent-written code."
        html: |
          <p>Agents are writing more and more code for us, and we all know it's getting harder to keep up.</p>
          <p>But the good news is: there are many ways to understand code! Reading diffs line by line is not the only way.</p>
      - slide: slide-03.webp
        alt: "Slide listing techniques: code explainer docs, quizzes, micro-worlds."
        html: |
          <p>Most of this talk will be about techniques I have found helpful to understand systems my agents are building:</p>
          <ul>
            <li>Code explainer docs</li>
            <li>Quizzes to check my understanding</li>
            <li>Micro-worlds that I can play with to understand the system</li>
          </ul>
          <p>But first we have to ask a more basic question&hellip;</p>
  - title: "Why understand?"
    segments:
      - slide: slide-04.webp
        alt: "Slide reading: Why understand?"
        html: |
          <p><strong>Why? Why understand?</strong></p>
          <p>Aren't we supposed to be taking ourselves out of the loop now, and letting the agents loop themselves? As the agents get smarter, doesn't it become less important for us to be in the details?</p>
          <p>I think many people &mdash; even those who are pro-understanding &mdash; have a slightly incorrect answer to this question!</p>
      - slide: slide-05.webp
        alt: "Slide: understand to verify."
        html: |
          <p>One possible answer: we understand <em>to verify</em>. We check the agent's work, we see if it's correct.</p>
          <p>Correct can mean many things: does it match the spec, is it well architected&hellip; but it's fundamentally a thumbs-up / thumbs-down question.</p>
      - slide: slide-06.webp
        alt: "Slide about agents getting better at verifying their own work."
        html: |
          <p>Here's the thing: the agents are getting better and better at verifying their own work. And this is good! I like it when my agent doesn't make mistakes.</p>
          <p>But hmm. Where does that leave us humans?</p>
      - slide: slide-07.webp
        alt: "Slide: understand to participate."
        html: |
          <p><strong>That's where another answer comes in: we can understand to participate.</strong></p>
          <p>You can learn what the agent is doing to make sure you can be an active participant in the creative process. Here's why this matters&hellip;</p>
      - slide: slide-08.webp
        alt: "Diagram of a project as many iterative loops with an agent."
        html: |
          <p>It's never just one loop! A project is many, many loops with the agent.</p>
          <p>And the understanding you have of the system is part of your ability to come up with the next idea to evolve it.</p>
          <p>You need a rich set of concepts in your mind to think creatively and fluently about how to move something forward. If you're lacking that fluency, your ability to participate in the project is meaningfully limited.</p>
      - slide: slide-09.webp
        alt: "Quote from Margaret Storey on cognitive debt: the humans involved may have simply lost the plot."
        html: |
          <p>By the way, this relates closely to the idea of <a href="https://margaretstorey.com/blog/2026/02/09/cognitive-debt/">cognitive debt</a>, popularized by Margaret Storey and <a href="https://simonwillison.net/">Simon Willison</a>.</p>
          <p>It's like tech debt: you can get away with not understanding what's going on in the short term, but it'll bite you eventually.</p>
      - slide: slide-10.webp
        alt: "Slide asking: how do we build understanding? Pointing to education for inspiration."
        html: |
          <p>OK, so fine, understanding matters.</p>
          <p>But this raises the next question: <em>how</em>? <strong>How do we build this human understanding when we're working with AI and moving fast?</strong></p>
          <p>Well, turns out this is not the first time anyone has ever thought about how to communicate understanding. I think we can look to education as an inspiration. Can we steal the best ideas ever invented for education and apply them to this problem?</p>
  - title: "Technique 1: Explanations"
    segments:
      - slide: slide-11.webp
        alt: "Slide listing three techniques, with 'explanations' highlighted."
        html: |
          <p>Today I want to share three techniques that show how we can attempt this.</p>
          <p>First: explanations. What makes a good explanation?</p>
      - slide: slide-12.webp
        alt: "Slide showing a raw code diff."
        html: |
          <p>Whenever an agent finishes some work, it's an opportunity for an explanation &mdash; an artifact.</p>
          <p>Most naively, we can read a code diff: the raw material that changed.</p>
      - slide: slide-13.webp
        alt: "Slide asking: what would the best explanation be?"
        html: |
          <p>But what if we ask:</p>
          <p><strong>What would the <em>best</em> explanation be?</strong> If you had a team &mdash; human or AI &mdash; that really sweat the details of explaining something well to you, how would that feel?</p>
      - slide: slide-14.webp
        alt: "Screenshot of a code explainer doc produced by the /explain-diff skill."
        html: |
          <p>Here's one answer. I made a skill called <a href="https://gist.github.com/geoffreylitt/a29df1b5f9865506e8952488eac3d524">/explain-diff</a>, which I use every day and many coworkers have found valuable.</p>
          <p>It outputs thoughtfully structured code explainers as HTML, markdown, or Notion docs. Notion is a good place for collaborating on and discussing these explainers as a team. (Disclaimer: I work at Notion so I'm biased.)</p>
          <p>Let's see what's in one of these explainers, using an example of editing the perspective of a video game.</p>
      - slide: slide-15.webp
        alt: "Explainer section teaching background info about the game engine."
        html: |
          <p>First principle: <strong>teach me background info!</strong></p>
          <p>Before we even get to what changed, help me understand what was already there. In this case, teach me about the game engine.</p>
      - slide: slide-16.webp
        alt: "Explainer section stating the goal of the change and explaining isometric projection."
        html: |
          <p>Second principle: <strong>intuition before details.</strong></p>
          <p>Before any code, it states the goal &mdash; &ldquo;make the garden feel three-dimensional with 2D drawing tricks&rdquo; &mdash; and explains related concepts, like what isometric projection is.</p>
          <p>All of this builds my intuition for the essence of the change. It's catching me up as the human so I can be an equal participant in understanding.</p>
      - video: video-17.mp4
        poster: poster-17.webp
        alt: "Screen recording of an interactive figure: dragging rocks around a garden scene while their coordinates update."
        html: |
          <p>You can also build intuition with <strong>interactive figures</strong>.</p>
          <p>Here I'm understanding the isometric perspective by dragging rocks around the garden and watching their coordinates move.</p>
          <p>(This is using a new feature Notion just shipped: you can now embed interactive HTML inside pages.)</p>
      - slide: slide-18.webp
        alt: "Slide contrasting a raw diff with a literate diff structured as prose."
        html: |
          <p>We finally get to the code. But a typical diff is a pile of files edited in alphabetical order with no explanation.</p>
          <p>A &ldquo;literate diff&rdquo; as I call it is structured as prose &mdash; walking through the changes in a sensible order, with surrounding explanation and embedded code snippets. Faster to review than a raw diff.</p>
      - slide: slide-19.webp
        alt: "Photo of a printed code explainer packet at a café."
        html: |
          <p>The end result of all of this is a nice explainer packet. I still read the code diff but I always read this first.</p>
          <p>Sometimes I'll print these out and take them to the café &mdash; less distracting.</p>
          <p>It's beautifully ironic: AI turns an interactive activity into a static paper report I can focus on deeply :)</p>
      - slide: slide-20.webp
        alt: "Slide quoting Andy Matuschak: books don't work. Screenshot of Quantum Country."
        html: |
          <p>There's only one problem: reading is hard work 😅</p>
          <p>As <a href="https://andymatuschak.org/books/">Andy Matuschak says: &ldquo;books don't work&rdquo;</a>! It's too easy to fool yourself into thinking you did the reading when you really didn't retain or understand.</p>
          <p>How do we fix this? I took inspiration from Andy and Michael Nielsen's work on <a href="https://quantum.country/">embedding spaced repetition quizzes in essays</a>.</p>
      - video: video-21.mp4
        poster: poster-21.webp
        alt: "Screen recording of answering an interactive quiz at the bottom of a code explainer."
        html: |
          <p>I do something similar with my code explainers now. At the bottom of an explainer there's an interactive quiz &mdash; five questions about the change &mdash; and I try to answer them.</p>
          <p>My rule: I won't send code to others until I can pass the quiz, and I do the same when reviewing others' code.</p>
      - slide: slide-22.webp
        alt: "Slide describing the quiz as a speed regulator on the AI loop."
        html: |
          <p><strong>A quiz is a speed regulator.</strong> Working with AI, it's easy for the loop to run faster than the speed of human understanding.</p>
          <p>The quiz is a counterbalancing force: I mechanically ask &ldquo;do I actually understand?&rdquo; so that I can remain a full creative participant.</p>
      - slide: slide-23.webp
        alt: "QR code linking to the /explain-diff skill."
        html: |
          <p>OK, so that's explain-diff. <a href="https://gist.github.com/geoffreylitt/a29df1b5f9865506e8952488eac3d524">Here's the skill if you want it</a>: two variants that output either HTML or a Notion page.</p>
  - title: "Technique 2: Micro-worlds"
    segments:
      - slide: slide-24.webp
        alt: "Slide introducing micro-worlds, with a photo of Seymour Papert."
        html: |
          <p>Next idea: micro-worlds. This one's inspired by the visionary educator Seymour Papert.</p>
      - slide: slide-25.webp
        alt: "Slide about Papert's idea of living in Mathland."
        html: |
          <p>Papert had this beautiful idea he called <em>living in Mathland</em>: if you want to learn math, live in Mathland &mdash; just like if you want to learn French, you go live in France. Could we build an environment where children learn math naturally, as a consequence of their curiosity?</p>
          <p>So how do we apply that to code? <strong>Can we make worlds you inhabit and naturally intuit how the system works and how it's changing?</strong></p>
      - video: video-27.mp4
        poster: poster-27.webp
        alt: "Screen recording of an interactive debugger for a Prolog interpreter: scrubbing through time and inspecting the stack."
        html: |
          <p>Last year I was coding a Prolog interpreter and struggling to intuit what was happening inside.</p>
          <p>I worked with an agent to build this debugger, which let me step through the execution of my logic language &mdash; scrub through time, see what's on the stack and which rules are evaluated at each step. I could even leave comments for myself (&ldquo;nice, we correctly applied that rule&rdquo;).</p>
          <p>There's a big difference between making a tool <em>for me</em> to debug and letting the agent debug &mdash; doing it myself is how I develop understanding along the way.</p>
      - video: video-28.mp4
        poster: poster-28.webp
        alt: "Screen recording of a control-panel UI for porting a website step by step, with old and new sites side by side."
        html: |
          <p>Another example. I was migrating my personal website from one framework to another, and Claude wrote a script that did it. But it was very hard to review: I wasn't familiar with the new framework, and all I could say was &ldquo;I guess that looks about right.&rdquo;</p>
          <p>So I asked Claude to make me a video game &mdash; a command center where I do the port myself, step by step, watching the visible effects and the file tree evolve. It produced a UI where I click buttons to run the port step by step, with my old site and new site running side by side.</p>
          <p>In this command center I watched the new site come to life incrementally. That left me with a similar understanding to doing it by hand &mdash; but much faster, because the whole experience was laid out for me.</p>
      - slide: slide-29.webp
        alt: "Slide reading: agents can write code to help us understand code!"
        html: |
          <p>The point here is that agents can write bits of code that help us humans understand other code.</p>
          <p>This is a big deal!</p>
  - title: "Technique 3: Shared spaces"
    segments:
      - slide: slide-30.webp
        alt: "Slide introducing shared spaces: understanding together as a team."
        html: |
          <p>Alright, last technique: shared spaces. So far this has all been about understanding solo&hellip; but <strong>when you're working on a team, you need to understand together.</strong></p>
      - slide: slide-31.webp
        alt: "Slide about shared mental models enabling efficient communication."
        html: |
          <p>When you and someone else hold the same mental model, you can communicate efficiently. You have a shared vocabulary that evokes the same images, so you can jam and riff and have creative conversations. Without those shared structures, those conversations are much harder.</p>
          <p>I'm really excited about creating shared environments where teams build that understanding together. It's kinda what Notion is all about too.</p>
      - slide: slide-32.webp
        alt: "Screenshot of Claude and Cursor agents running inside Notion."
        html: |
          <p>Recently in Notion we've been shipping tons of new features for humans and agents to work together, so your whole team develops a shared understanding instead of each working in a silo.</p>
          <p>One tiny example: you can now run Claude and Cursor agents in Notion. I do a lot of my coding that way now.</p>
          <p>And when those agents make a technical plan in Notion, it's in a collaborative page by default, so I can comment on it with my team and discuss immediately. Thinking together, not alone!</p>
  - title: "The point was always to augment"
    segments:
      - slide: slide-33.webp
        alt: "Slide: it's still important for humans to understand how things work."
        html: |
          <p>Alright, let's wrap up. Today we've covered some techniques that were about understanding code&hellip; but actually I think this is a much bigger issue.</p>
          <p>It's still important for humans to understand how things work <em>in general</em>! <strong>Not just to verify, but to participate.</strong></p>
          <p>And surprise surprise, this is not a new idea. It harkens back to the very origins of our field of computing&hellip;</p>
      - slide: slide-34.webp
        alt: "Alan Kay's vision: kids learning physics by playing and editing an interactive simulation."
        html: |
          <p>50 years ago Alan Kay envisioned that computers could be a new medium, better than the book, for teaching people &mdash; especially kids &mdash; how to think about the world.</p>
          <p>In this picture, it might look like these kids are watching YouTube on an iPad, but they're not. They're playing an interactive game and editing the code as they play it to get a better understanding of physics. This was 50 years ago!!</p>
      - slide: slide-35.webp
        alt: "Astronaut meme: wait, the point of computers is to create new dynamic simulations to help people understand complex concepts? Always has been."
        html: |
          <p>And now hopefully you understand <a href="https://x.com/geoffreylitt/status/2071362040346955777">this meme</a>.</p>
          <p>The point was always to <em>augment</em>, not just automate.</p>
          <p>It's beautiful that AI now makes creating simulations so accessible&hellip; Having AI teach us is one of the greatest possibilities computing has ever opened up.</p>
      - slide: slide-36.webp
        alt: "Closing slide: we can get deeper in the loop. It's up to us."
        html: |
          <p>This makes me very optimistic about the future!</p>
          <p><strong>If we build the right tools, we can now understand the world better than we ever could before.</strong> We don't have to merely take ourselves out of the loop, we can get <em>deeper in the loop</em> too. It's up to us.</p>
          <p><em>FIN</em></p>
