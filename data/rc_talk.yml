    html: |-
      <p>A lot of people, when they think about code review, picture a human asking: &quot;Is this code correct?&quot; Is it buggy, does it match the spec</p>

      <p>But fundamentally, this is a thumbs-up / thumbs-down gate that the human is applying.</p>

      <p>Now, here&#39;s the thing. As the agents get smarter, and as we give them better tools, they&#39;re getting better at asking that question themselves. And our role is fading. It was never really our greatest contribution to the work anyway.</p>

