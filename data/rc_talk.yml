- title: Margin Notes (2018)
  segments:
  - slide: slide-10.webp
    figma_id: 2106:1040
    figma_name: '10'
    alt: Slide 10 from the talk “Dynamic documents as personal software”.
    html: |-
      <p>Hot take: code is unnecessarily hard to read.
      Example: some ruby code, part of a tic tac toe game.
      What does this method return?</p>

      <p>Now maybe you can give it some thought and figure it out... but it takes a few seconds even if you&#39;re good at reading code.</p>

      <p>Why is this hard? Well one reason: you can&#39;t see the data!!!
      You can only see the abstract logic so you have to <strong>simulate a computer</strong> in your head.</p>

      <p>When you think about it this is a bit silly. The computer is already running this code with real data.
      So let&#39;s see it!</p>
  - slide: slide-11.webp
    figma_id: 2014:285
    figma_name: '11'
    alt: Slide 11 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>here&#39;s a system i built called Margin Notes</li>
      <li>it records some examples of what methods returned</li>
      <li>surface them inline as you browse the code</li>
      <li>simple but speeds you up!</li>
      </ul>
  - slide: slide-12.webp
