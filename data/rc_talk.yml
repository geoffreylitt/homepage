  - slide: slide-23.webp
    figma_id: 2015:280
    figma_name: '23'
    alt: Slide 23 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>https://www.inkandswitch.com/potluck/</li>
      </ul>
  - slide: slide-24.webp
    figma_id: 2154:1265
    figma_name: '24'
    alt: Slide 24 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;Let&#39;s see an example of how it feels to use a simple Potluck document. Below is a simple recipe for making coffee, which includes an interactive slider that can scale up the number of servings.&quot;</li>
      <li>&quot;we&#39;ve 1) constructed a search that finds the quantities of coffee and water, 2) run a computation that multiplies those quantities, and then 3) set up some annotations to overlay the scaled quantities over the original ones.&quot;</li>
      </ul>
  - slide: slide-25.webp
    figma_id: 2015:282
    figma_name: '25'
    alt: Slide 25 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;We&#39;ve found that many different kinds of software can be built in Potluck. We&#39;ve used it to build tools for tracking household chores, managing a cash register, organizing a meeting agenda, tracking workouts, splitting a bill, and planning a trip.&quot;</li>
      </ul>
  - slide: slide-26.webp
    figma_id: 2015:284
    figma_name: '26'
    alt: Slide 26 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li><strong>Caption:</strong> &quot;A workshop agenda. Each line has a duration, and the start/end times are computed.&quot;</li>
      <li>Note what&#39;s <em>not</em> here: no table, no schema, no app. Just a note where the times add themselves up.</li>
      </ul>
  - slide: slide-27.webp
    figma_id: 2015:286
    figma_name: '27'
    alt: Slide 27 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li><strong>Caption:</strong> &quot;A cash register where each item for sale is represented as an emoji.&quot;</li>
      <li>Emoji as the primary key is a good laugh line — and a real demonstration that the user picks the syntax, not the tool.</li>
      </ul>
  - slide: slide-28.webp
    figma_id: 2016:280
    figma_name: '28'
    alt: Slide 28 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;Users are already familiar with searching for content in a word processor or web browser, so it&#39;s a natural on-ramp to creating live data detectors.&quot;</li>
      <li>&quot;As an easy start, the user can search for a string literal: <code>11 g</code>... Searches run continuously against the note&#39;s content, so the results update as we update the text note.&quot;</li>
      </ul>
  - slide: slide-29.webp
    figma_id: 2016:282
    figma_name: '29'
    alt: Slide 29 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;the user can do this by rewriting their search from <code>11 g</code> to <code>{number} g</code>. This works because Potluck searches can reference other existing searches, by putting the name of an existing search inside of curly braces. Potluck comes with many simple patterns built in, including numbers, dates, and phone numbers.&quot;</li>
      <li>&quot;If they edit the search to say <code>{number:amount} g</code>, the table of results will automatically show a column that just contains the amount.&quot;</li>
      </ul>
  - slide: slide-30.webp
    figma_id: 2016:284
    figma_name: '30'
    alt: Slide 30 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;the user adds a computed property called <code>scaledQuantity</code> that is the result of multiplying the quantity by a scale factor. For now, they want to make 2 cups of coffee, so they just write a simple formula: <code>amount \* 2</code>. Later they&#39;ll make the scale factor adjustable.&quot;</li>
      <li>&quot;Each column computes a small pure expression that automatically re-evaluates reactively, and the current output is shown live in the table.&quot;</li>
      </ul>
  - slide: slide-31.webp
    figma_id: 2016:286
    figma_name: '31'
    alt: Slide 31 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;Potluck offers several annotation locations: above the text, next to the text, or replacing the text. In this case, the user tries out a few options for where to place the annotation, and decides to cover up the original text with the scaled value.&quot;</li>
      </ul>
  - slide: slide-32.webp
    figma_id: 2016:294
    figma_name: '32'
    alt: Slide 32 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;It&#39;s hard for a user to tell at a glance which plants should be watered today... The user can do this by adding a computed property which outputs &#39;red&#39; or &#39;green&#39;, and assigning that to control the color of the underlying search result. Any CSS property can be addressed by dynamic formatting, including color, font size, and font weight.&quot;</li>
      <li>&quot;they are overlays applied to the text at view time, and they don&#39;t durably edit the state of the underlying text in any way... eliminating the potential for confusing feedback loops between the two layers.&quot;</li>
      </ul>
  - slide: slide-33.webp
    figma_id: 2017:289
    figma_name: '33'
    alt: Slide 33 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>https://www.inkandswitch.com/embark/</li>
      </ul>
  - slide: slide-34.webp
    figma_id: 2154:1271
    figma_name: '34'
    alt: Slide 34 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;When he wants to reference certain kinds of structured objects like a place or a date, he can create a mention by typing &#39;@&#39; and picking a choice from an autocomplete menu. Mentions are simply links to other outline nodes containing structured data. For example, when Paul chooses &#39;Chocolate Factory&#39; from the autocomplete menu... the system automatically creates an outline node and populates it with information pulled from Google Maps.&quot;</li>
      </ul>
  - slide: slide-35.webp
    figma_id: 2017:291
    figma_name: '35'
    alt: Slide 35 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;its children contain structured information stored in named properties, like <code>rating: 4.7</code>. Embark has a lightweight syntax for such properties: any outline node can have a name, using the syntax <code>name: value</code>. These names can be manually written by the user or filled in by automatic data importers.&quot;</li>
      <li>&quot;we will see much more powerful uses of mentions later on, when they help the environment make sense of structured information to power views and computations.&quot;</li>
      </ul>
  - slide: slide-36.webp
    figma_id: 2017:293
    figma_name: '36'
    alt: Slide 36 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;Paul wants to share the plan with his friends and include a map as a visual overview. He can do this by adding a map view, which reads in any nodes containing location information and displays them as markers on the map. The place mentions he created earlier appear on the map because they contain location coordinates imported from Google Maps.&quot;</li>
      <li>&quot;The map is just one instance of a view; Embark also includes a few other simple views including tables and calendars. Each view instance is associated with some node in the outline and can access any data in that node or the subtree underneath.&quot;</li>
      </ul>
  - slide: slide-37.webp
    figma_id: 2017:295
    figma_name: '37'
    alt: Slide 37 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;Views are not limited to accessing data created by automatic importers; they can also access data entered manually by the user. Paul can take advantage of this to customize his map further. First, he wants to show some custom icons for various points they are visiting. He can do this by adding an &#39;icon&#39; property to some of the places they are visiting.&quot;</li>
      </ul>
  - slide: slide-38.webp
    figma_id: 2017:297
    figma_name: '38'
    alt: Slide 38 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;Because his outline is already organized hierarchically by day, he can set a <code>color</code> property for various sub-trees of the outline, and the map will color the points taken from that tree.&quot;</li>
      </ul>
  - slide: slide-39.webp
    figma_id: 2017:299
    figma_name: '39'
    alt: Slide 39 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;Embark offers formulas: dynamic computations that use data from the outline as inputs and produce further outline nodes as output. Users can always write formulas manually as in a spreadsheet, but Embark also offers affordances for automatically suggesting formulas.&quot;</li>
      <li>&quot;When he clicks on the node for Friday in the outline, the UI suggests formulas that could apply to this node, including the one he wants: <code>Weather(in: @Aachen, on: @Friday)</code>. To power this suggestion, the system uses a heuristic that examines the surrounding context in the outline to recommend useful formulas. In this case, Aachen was mentioned in the top node of the document, so the system used that as the location input.&quot;</li>
      <li>&quot;The results will automatically update as the weather forecast updates. Paul can move or annotate the result just like any other outline node.&quot;</li>
      </ul>
  - slide: slide-40.webp
    figma_id: 2018:286
    figma_name: '40'
    alt: Slide 40 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;Paul wants to get the weather for all the days of the trip. He could achieve this by redoing the same process manually, but Embark also offers a faster way: a repeat button that automatically copies the formula to various parts of the outline, while changing the inputs to match the surrounding context for each copy. For example, the weather formula keeps the same location, but gets a new date to match each date of the trip.&quot;</li>
      <li>&quot;the repeat button works by inferring an abstract pattern for the formula based on how its arguments relate to the outline. After inferring this pattern, Embark tries to find other places in the outline that match this shape and insert a formula using the matched nodes as arguments.&quot;</li>
      <li>&quot;a special system-wide outline containing user preferences.&quot;</li>
      </ul>
  - slide: slide-41.webp
    figma_id: 2018:288
    figma_name: '41'
    alt: Slide 41 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;Fuzzy text is effective for filtering the list of possible formulas because it&#39;s not searching over all possible places, only the places which have already been mentioned in this document.&quot;</li>
      <li>&quot;He concludes the best option is to go there by car, and adds the <code>Drive</code> formula to his outline. The result of this formula displays the time and distance expected for the drive. Internally, it contains more structured data, including a geographic path which can be displayed by the map.&quot;</li>
      </ul>
  - slide: slide-42.webp
    figma_id: 2018:290
    figma_name: '42'
    alt: Slide 42 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;he assigns the name &#39;route&#39; to the outline node with the route computation, which lets him refer to it from other nodes. He can then write new formulas which use the distance of the route to compute the price based on the cost per kilometer (30 cents) and the fixed daily rate (25 Euros). The formula language has a syntax <code>route.distance</code> for accessing named children of the mention returned by the formula result.&quot;</li>
      <li>&quot;In most apps, computations like routes only show up in a specified view; in Embark, they return structured data into the outline, which can be displayed in standard ways or repurposed for more custom purposes.&quot;</li>
      </ul>
  - slide: slide-43.webp
    figma_id: 2018:292
    figma_name: '43'
    alt: Slide 43 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;Because the result of the weather forecast formula above is a mention containing structured data, it can be passed into a view and combined with other data. Paul can use a single calendar view to show the hourly precipitation probability from the weather formula alongside the opening hours of the flea market that he manually entered into the outline.&quot;</li>
      <li>&quot;When Paul looks at the calendar, it becomes clear that he and his friends should go to the flea market first because it&#39;s less likely to rain in the morning.&quot;</li>
      <li>&quot;if you open Google Calendar and pull up the weather forecast in another tab, there is no way to combine these two data sources in a single view. This is possible in Embark because the weather forecast and the time information live in the same data substrate.&quot;</li>
      </ul>
  - slide: slide-44.webp
    figma_id: 2018:294
    figma_name: '44'
    alt: Slide 44 from the talk “Dynamic documents as personal software”.
    html: |-
      <ul>
      <li>&quot;A dinner pit stop: Geoffrey was on a road trip to Maine and needed to decide where to stop for dinner. He used the outline view to assess relative drive times, and used the map view to pick a scenic coastal route.&quot;</li>
      <li>&quot;It was helpful to interleave casual notes directly in the document with the rest of our plans.&quot;</li>
      </ul>
- title: notion
  segments:
  - slide: slide-45.webp
    figma_id: 2154:1321
    figma_name: '45'
    alt: Slide 45 from the talk “Dynamic documents as personal software”.
    html: |-
      <p>Final leg: deploying at scale.
      So until this point I&#39;ve been showing small scale research prototypes. Sharing demos and essays but not working software.
      I ended up deciding I wanted to go back to startups and build for users again.
      So now I&#39;m at Notion.
      And I want to share a bit about how this all connects there.</p>
  - slide: slide-46.webp
    figma_id: 2089:397
    figma_name: '46'
    alt: Slide 46 from the talk “Dynamic documents as personal software”.
    html: |-
      <p>A lot of people, when they think about code review, picture a human asking: &quot;Is this code correct?&quot; And &quot;correct&quot; could mean: is it buggy? Does it match the spec I gave it? Or even harder-to-verify things, like: does it have good architecture?</p>

      <p>But fundamentally, this is a thumbs-up / thumbs-down, is-it-correct gate that the human is applying.</p>

      <p>Now, here&#39;s the thing. As the agents get smarter, and as we give them better tools, they&#39;re getting better and better at asking that question themselves. Over time, the amount of &quot;thumbs down, not correct&quot; the human gives is going to go down and down — the human role in correctness-checking is fading.</p>

      <p>This is not a bad thing, to be clear — having robots that can automatically produce correct output is great.</p>
  - slide: slide-47.webp
    figma_id: 2089:406
    figma_name: '47'
    alt: Slide 47 from the talk “Dynamic documents as personal software”.
    html: |-
      <p>A lot of people, when they think about code review, picture a human asking: &quot;Is this code correct?&quot; And &quot;correct&quot; could mean: is it buggy? Does it match the spec I gave it? Or even harder-to-verify things, like: does it have good architecture?</p>

      <p>But fundamentally, this is a thumbs-up / thumbs-down, is-it-correct gate that the human is applying.</p>

      <p>Now, here&#39;s the thing. As the agents get smarter, and as we give them better tools, they&#39;re getting better and better at asking that question themselves. Over time, the amount of &quot;thumbs down, not correct&quot; the human gives is going to go down and down — the human role in correctness-checking is fading.</p>

      <p>This is not a bad thing, to be clear — having robots that can automatically produce correct output is great.</p>
