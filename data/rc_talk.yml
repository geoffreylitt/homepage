    alt: 'Title slide: Dynamic documents as personal software.'
    html: |-
      <p>Hi everyone, it&#39;s great to be here.</p>

      <p>So the title of this talk is &quot;dynamic documents as personal software&quot;.</p>

      <p>I spend a lot of time thinking about fresh ways to view the basic building blocks of computing, things like &quot;documents&quot; and &quot;applications&quot; - and today, by sharing some of those ideas, I hope to change the way that you see those building blocks.</p>
  - slide: slide-02.webp
    figma_id: 2105:916
    figma_name: '2'
    alt: Slide 2 from the talk “Dynamic documents as personal software”.
    html: |-
      <p>But this talk could also be called How to take a rabbit hole very seriously</p>

      <p>So this has been almost a decade long quest now, and I&#39;ve learned a lot about what it looks like, in very practical terms, to go deep on a nerdy topic. And if you&#39;re at RC or part of this community, you&#39;re probably the kind of person who likes nerdy rabbit holes and may want to up your level of seriousness.</p>

      <p>So I hope to share some ideas on that meta level too.</p>
  - slide: slide-03.webp
    figma_id: 2146:1116
    figma_name: '3'
    alt: Slide 3 from the talk “Dynamic documents as personal software”.
    html: |-
      <p>Looking back, it all started right here!</p>

      <p>I was part of the first ever one-week &quot;Mini Batch&quot; in January 2018, and it ended up being one of the most important weeks of my career.</p>

      <p>I looked back for photos from that time, and for some reason the only photo I took was of a Christmas tree on the street as I was walking to RC one morning. So you can tell it was January.</p>

      <p>My project at RC was following a curriculum to implement a Lisp, which was a ton of fun. But more importantly I was exposed to some new ideas and people...</p>
  - slide: slide-04.webp
    figma_id: 2089:381
    figma_name: '4'
    alt: Slide 4 from the talk “Dynamic documents as personal software”.
    html: "<p>I met the programming languages researcher named Alex Warth, who was
      working on a &quot;directional programming language&quot; that opened my eyes
      to new ways of specifying behavior.</p>"
  - slide: slide-05.webp
    figma_id: 2015:292
    figma_name: '5'
    alt: Slide 5 from the talk “Dynamic documents as personal software”.
    html: "<p>And I also learned about the work of Bret Victor, an interface designer
      who&#39;s explored ideas like reactive documents that blend interaction with
      explanation.</p>"
  - slide: slide-06.webp
    figma_id: 2105:1024
    figma_name: '6'
    alt: Slide 6 from the talk “Dynamic documents as personal software”.
    html: |-
      <p>And finally, less than a week after leaving RC, when I got back home to Boston, I met Glen Chiacchieri - who was previously an RC Resident.</p>

      <p>He was presenting Flowsheets, a prototype system that blended a spreadsheet UI with arbitrary python code.</p>
  - slide: slide-07.webp
    figma_id: 2151:1232
    figma_name: '7'
    alt: Slide 7 from the talk “Dynamic documents as personal software”.
    html: |-
      <p>Now these three people were all exploring ideas hovering around a shared theme:
      How can we blend “documents” and “programming”?</p>

      <p>I decided I wanted to explore that question too.</p>
