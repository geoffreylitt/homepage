    figma_name: '78'
    alt: Slide 78 from the talk “Dynamic documents as personal software”.
    html: |-
      <p>This is the meme version of this whole talk</p>

      <p>Alan Kay says the real computer revolution hasn&#39;t happened yet: the goal of computers was never just to automate, it was to help us understand the world by creating simulations on the fly.</p>

      <p>The point was always to augment, not just automate. It&#39;s beautiful that AI now makes creating simulations so accessible — having AI teach us is one of the greatest possibilities computing has opened up.</p>
