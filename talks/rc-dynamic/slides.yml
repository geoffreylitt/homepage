- id: '2089:547'
  name: '57'
  section: notion
  skipped: false
  alt:
  notes: |
    But this raises the next question: how? How do we build this human understanding when we're working with AI and moving fast?
- id: '2089:552'
  name: '58'
  section: notion
  skipped: false
  alt:
  notes: |
    The right way to approach this is to ask a simpler question: how do we build human understanding of complex concepts at all? It turns out this isn't the first time the question has been asked.
- id: '2089:556'
  name: '59'
  section: notion
  skipped: false
  alt:
  notes: |
    Many people have thought about this. Education is a whole field dedicated to answering that question.

    We can take inspiration from some of the best ideas ever invented in education — especially around using computers to educate — and apply them to this problem of understanding what our agents are doing.
