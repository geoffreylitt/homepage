- id: '2106:1040'
  name: '10'
  section: Margin Notes (2018)
  skipped: false
  alt:
  notes: |
    Hot take: code is unnecessarily hard to read.
    Example: some ruby code, part of a tic tac toe game.
    What does this method return?

    Now maybe you can give it some thought and figure it out... but it takes a few seconds even if you're good at reading code.

    Why is this hard? Well one reason: you can't see the data!!!
    You can only see the abstract logic so you have to **simulate a computer** in your head.

    When you think about it this is a bit silly. The computer is already running this code with real data.
    So let's see it!
- id: '2014:285'
