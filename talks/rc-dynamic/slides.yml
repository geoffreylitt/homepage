- id: '1:1683'
  name: '1'
  section: intro
  skipped: false
  alt: 'Title slide: Dynamic documents as personal software.'
  notes: |
    Hi everyone, it's great to be here.

    So the title of this talk is "dynamic documents as personal software".

    I spend a lot of time thinking about fresh ways to view the basic building blocks of computing, things like "documents" and "applications" - and today, by sharing some of those ideas, I hope to change the way that you see those building blocks.
- id: '2105:916'
  name: '2'
  section: intro
  skipped: false
  alt:
  notes: |
    But this talk could also be called How to take a rabbit hole very seriously

    So this has been almost a decade long quest now, and I've learned a lot about what it looks like, in very practical terms, to go deep on a nerdy topic. And if you're at RC or part of this community, you're probably the kind of person who likes nerdy rabbit holes and may want to up your level of seriousness.

    So I hope to share some ideas on that meta level too.
- id: '2146:1116'
  name: '3'
  section: intro
  skipped: false
  alt:
  notes: |
    Looking back, it all started right here!

    I was part of the first ever one-week "Mini Batch" in January 2018, and it ended up being one of the most important weeks of my career.

    I looked back for photos from that time, and for some reason the only photo I took was of a Christmas tree on the street as I was walking to RC one morning. So you can tell it was January.

    My project at RC was following a curriculum to implement a Lisp, which was a ton of fun. But more importantly I was exposed to some new ideas and people...
- id: '2089:381'
  name: '4'
  section: intro
  skipped: false
  alt:
  notes: |
    I met the programming languages researcher named Alex Warth, who was working on a "directional programming language" that opened my eyes to new ways of specifying behavior.
- id: '2015:292'
  name: '5'
  section: intro
  skipped: false
  alt:
  notes: |
    And I also learned about the work of Bret Victor, an interface designer who's explored ideas like reactive documents that blend interaction with explanation.
- id: '2105:1024'
  name: '6'
  section: intro
  skipped: false
  alt:
  notes: |
    And finally, less than a week after leaving RC, when I got back home to Boston, I met Glen Chiacchieri - who was previously an RC Resident.

    He was presenting Flowsheets, a prototype system that blended a spreadsheet UI with arbitrary python code.
