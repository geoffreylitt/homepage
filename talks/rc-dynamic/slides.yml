  alt:
  notes: |
    First principle: teach me background info!
    Before we even get to what changed, help me understand what was already there.
- id: '2089:634'
  name: '68'
  section: notion
  skipped: false
  alt:
  notes: |
    Second principle: intuition before details.
    Before any code, it states the goal — "make the garden feel three-dimensional with 2D drawing tricks" — and explains related concepts, like what isometric projection is.

    All of this builds my intuition for the essence of the change.
    it's catching me up as the human so I can be an equal participant in understanding.
- id: '2089:637'
  name: '69'
  section: notion
  skipped: false
  alt:
  notes: |
    You can also build intuition with interactive figures.
    Here I'm understanding the isometric perspective by dragging rocks around the garden and watching their coordinates move.

    This is using a new feature Notion just shipped today actually, you can now embed interactive HTML inside pages.
- id: '2089:640'
  name: '70'
  section: notion
  skipped: false
  alt:
  notes: |
    We finally get to the code.
    But A typical diff is a pile of files edited in alphabetical order with no explanation.
    A literate diff is structured as prose — walking through the changes in a sensible order, with surrounding explanation and embedded code snippets. Faster to review than a raw diff.

    Put it all together and you get a really nice explanation packet.

    I do still review diffs in GitHub, but I always start here
- id: '2089:643'
  name: '71'
  section: notion
  skipped: false
  alt:
  notes: |
    Sometimes I'll print these out and take them to the café — less distracting.
    It's beautifully ironic: AI turns a highly interactive activity into a static paper report I can focus on deeply.
- id: '2089:645'
  name: '72'
  section: notion
  skipped: false
  alt:
  notes: |
    But there's one problem: reading is hard work :)
    It's tempting to skip ahead and convince yourself you've understood.

    One time I sent a coworker a PR I thought I understood — she asked a few questions and I realized I had no idea what was going on.
    I'd sent her slop. That was on me, and I wanted a system to make sure I actually did the reading.
- id: '2089:648'
  name: '73'
  section: notion
  skipped: false
  alt:
  notes: |
    For inspiration I looked to Andy Matuschak, who has this lovely line: "books don't work."

    It's very easy to read a book and not realize you didn't retain anything — easy to read without engaging actively enough to actually internalize the knowledge.
- id: '2089:653'
  name: '74'
  section: notion
  skipped: false
  alt:
  notes: |
    So Andy and his collaborator Michael Nielsen embedded spaced-repetition quizzes into the flow of an essay.
    As you read, you quiz yourself and mark whether you could recall it — and they keep resurfacing the questions so you retain them long-term.

    I found this intriguing: a way to introduce speed bumps into your reading — checks for understanding so you know you're following along.
- id: '2089:656'
  name: '75'
  section: notion
  skipped: false
  alt:
  notes: |
    I do something similar with my code explainers now. At the bottom of an explainer there's an interactive quiz — five questions about the change — and I try to answer them.

    My rule: I won't send code to others until I can pass the quiz, and I do the same when reviewing others' code.
- id: '2089:659'
  name: '76'
  section: notion
  skipped: false
  alt:
  notes: |
    I think of this as a speed regulator. Working with AI, it's easy for the loop to run faster than the speed of human understanding.

    The quiz is a counterbalancing force: I mechanically ask "do I actually understand?" so that I can remain a full creative participant.
- id: '2089:670'
  name: '77'
  section: notion
  skipped: false
  alt:
  notes: |
    if you want the skill, here it is
- id: '176:990'
  name: '78'
  section: conclusion
  skipped: false
  alt:
  notes: |
    This is the meme version of this whole talk

    Alan Kay says the real computer revolution hasn't happened yet: the goal of computers was never just to automate, it was to help us understand the world by creating simulations on the fly.

    The point was always to augment, not just automate. It's beautiful that AI now makes creating simulations so accessible — having AI teach us is one of the greatest possibilities computing has opened up.
