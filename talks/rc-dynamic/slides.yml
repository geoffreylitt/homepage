- id: '2089:596'
  name: '62'
  section: notion
  skipped: false
  alt:
  notes: |
    Whenever an agent finishes some work, it's an opportunity for an explanation — an artifact. Most naively, a code diff: the raw material that changed.
- id: '2089:605'
  name: '63'
  section: notion
  skipped: false
  alt:
  notes: |
    But I've always wondered what the best possible explanation would look like. If you had a team — human or AI — that really sweat the details of explaining something well to you, how would that feel?

    So I made a skill for agents called explain-diff, which I use every day and many coworkers have found valuable. It can output markdown or HTML — but my favorite is a Notion page, because then these explanations live as collaborative docs. Here's what it puts into the explanation.
