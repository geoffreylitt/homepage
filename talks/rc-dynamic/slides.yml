- id: '2089:443'
  name: '50'
  section: notion
  skipped: false
  alt:
  notes: |
    But all of this discussion around correctness-checking is missing a deeper reason for understanding: participation.
- id: '2089:446'
  name: '51'
  section: notion
  skipped: false
  alt:
  notes: |
    One of the things that happens in a code review is that you gain an understanding of the system.
- id: '2089:455'
  name: '52'
  section: notion
  skipped: false
  alt:
  notes: |
    One of the things that happens in a code review is that you gain an understanding of the system. And that matters because this isn't a single loop — after you finish one task, you go to the next, and the next.
- id: '2089:466'
  name: '53'
  section: notion
  skipped: false
  alt:
  notes: |
    The understanding you have of the system is part of your ability to come up with the next idea to evolve it. You need a rich set of concepts in your mind to think creatively and fluently about how to move something forward. And if you're lacking that fluency, your ability to participate in the project is meaningfully limited.
- id: '2089:475'
  name: '54'
  section: notion
  skipped: false
  alt:
  notes: |
    The understanding you have of the system is part of your ability to come up with the next idea to evolve it. You need a rich set of concepts in your mind to think creatively and fluently about how to move something forward. And if you're lacking that fluency, your ability to participate in the project is meaningfully limited.
- id: '2089:504'
  name: '55'
  section: notion
  skipped: false
  alt:
  notes: |
    The understanding you have of the system is part of your ability to come up with the next idea to evolve it. You need a rich set of concepts in your mind to think creatively and fluently about how to move something forward. And if you're lacking that fluency, your ability to participate in the project is meaningfully limited.
- id: '2089:535'
  name: '56'
  section: notion
  skipped: false
  alt:
  notes: |
    You might get away with not understanding short term, but long term it'll bite you.

    There's a great concept
    called cognitive debt, popularized by Margaret Storey — an analogy to technical debt. As your own understanding of the system falls behind, you build up a kind of debt: fine in the short term, but over the long term it diminishes your ability to participate.

    Put another way: understanding is the bottleneck — exceptional work can't be done faster than the speed of understanding.
- id: '2089:540'
  name: '-'
  section: notion
