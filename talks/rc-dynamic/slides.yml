- id: '2154:1265'
  name: '24'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "Let's see an example of how it feels to use a simple Potluck document. Below is a simple recipe for making coffee, which includes an interactive slider that can scale up the number of servings."
    - "we've 1) constructed a search that finds the quantities of coffee and water, 2) run a computation that multiplies those quantities, and then 3) set up some annotations to overlay the scaled quantities over the original ones."
- id: '2015:282'
  name: '25'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "We've found that many different kinds of software can be built in Potluck. We've used it to build tools for tracking household chores, managing a cash register, organizing a meeting agenda, tracking workouts, splitting a bill, and planning a trip."
- id: '2015:284'
  name: '26'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - **Caption:** "A workshop agenda. Each line has a duration, and the start/end times are computed."
    - Note what's *not* here: no table, no schema, no app. Just a note where the times add themselves up.
- id: '2015:286'
  name: '27'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - **Caption:** "A cash register where each item for sale is represented as an emoji."
    - Emoji as the primary key is a good laugh line — and a real demonstration that the user picks the syntax, not the tool.
- id: '2016:280'
  name: '28'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "Users are already familiar with searching for content in a word processor or web browser, so it's a natural on-ramp to creating live data detectors."
    - "As an easy start, the user can search for a string literal: \`11 g\`... Searches run continuously against the note's content, so the results update as we update the text note."
- id: '2016:282'
  name: '29'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "the user can do this by rewriting their search from \`11 g\` to \`{number} g\`. This works because Potluck searches can reference other existing searches, by putting the name of an existing search inside of curly braces. Potluck comes with many simple patterns built in, including numbers, dates, and phone numbers."
    - "If they edit the search to say \`{number:amount} g\`, the table of results will automatically show a column that just contains the amount."
- id: '2016:284'
  name: '30'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "the user adds a computed property called \`scaledQuantity\` that is the result of multiplying the quantity by a scale factor. For now, they want to make 2 cups of coffee, so they just write a simple formula: \`amount \* 2\`. Later they'll make the scale factor adjustable."
    - "Each column computes a small pure expression that automatically re-evaluates reactively, and the current output is shown live in the table."
- id: '2016:286'
  name: '31'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "Potluck offers several annotation locations: above the text, next to the text, or replacing the text. In this case, the user tries out a few options for where to place the annotation, and decides to cover up the original text with the scaled value."
- id: '2016:294'
  name: '32'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "It's hard for a user to tell at a glance which plants should be watered today... The user can do this by adding a computed property which outputs 'red' or 'green', and assigning that to control the color of the underlying search result. Any CSS property can be addressed by dynamic formatting, including color, font size, and font weight."
    - "they are overlays applied to the text at view time, and they don't durably edit the state of the underlying text in any way... eliminating the potential for confusing feedback loops between the two layers."
- id: '2017:289'
  name: '33'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - https://www.inkandswitch.com/embark/
- id: '2154:1271'
  name: '34'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "When he wants to reference certain kinds of structured objects like a place or a date, he can create a mention by typing '@' and picking a choice from an autocomplete menu. Mentions are simply links to other outline nodes containing structured data. For example, when Paul chooses 'Chocolate Factory' from the autocomplete menu... the system automatically creates an outline node and populates it with information pulled from Google Maps."
- id: '2017:291'
  name: '35'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "its children contain structured information stored in named properties, like \`rating: 4.7\`. Embark has a lightweight syntax for such properties: any outline node can have a name, using the syntax \`name: value\`. These names can be manually written by the user or filled in by automatic data importers."
    - "we will see much more powerful uses of mentions later on, when they help the environment make sense of structured information to power views and computations."
- id: '2017:293'
  name: '36'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "Paul wants to share the plan with his friends and include a map as a visual overview. He can do this by adding a map view, which reads in any nodes containing location information and displays them as markers on the map. The place mentions he created earlier appear on the map because they contain location coordinates imported from Google Maps."
    - "The map is just one instance of a view; Embark also includes a few other simple views including tables and calendars. Each view instance is associated with some node in the outline and can access any data in that node or the subtree underneath."
- id: '2017:295'
  name: '37'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "Views are not limited to accessing data created by automatic importers; they can also access data entered manually by the user. Paul can take advantage of this to customize his map further. First, he wants to show some custom icons for various points they are visiting. He can do this by adding an 'icon' property to some of the places they are visiting."
- id: '2017:297'
  name: '38'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "Because his outline is already organized hierarchically by day, he can set a \`color\` property for various sub-trees of the outline, and the map will color the points taken from that tree."
- id: '2017:299'
  name: '39'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "Embark offers formulas: dynamic computations that use data from the outline as inputs and produce further outline nodes as output. Users can always write formulas manually as in a spreadsheet, but Embark also offers affordances for automatically suggesting formulas."
    - "When he clicks on the node for Friday in the outline, the UI suggests formulas that could apply to this node, including the one he wants: \`Weather(in: @Aachen, on: @Friday)\`. To power this suggestion, the system uses a heuristic that examines the surrounding context in the outline to recommend useful formulas. In this case, Aachen was mentioned in the top node of the document, so the system used that as the location input."
    - "The results will automatically update as the weather forecast updates. Paul can move or annotate the result just like any other outline node."
- id: '2018:286'
  name: '40'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "Paul wants to get the weather for all the days of the trip. He could achieve this by redoing the same process manually, but Embark also offers a faster way: a repeat button that automatically copies the formula to various parts of the outline, while changing the inputs to match the surrounding context for each copy. For example, the weather formula keeps the same location, but gets a new date to match each date of the trip."
    - "the repeat button works by inferring an abstract pattern for the formula based on how its arguments relate to the outline. After inferring this pattern, Embark tries to find other places in the outline that match this shape and insert a formula using the matched nodes as arguments."
    - "a special system-wide outline containing user preferences."
- id: '2018:288'
  name: '41'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "Fuzzy text is effective for filtering the list of possible formulas because it's not searching over all possible places, only the places which have already been mentioned in this document."
    - "He concludes the best option is to go there by car, and adds the \`Drive\` formula to his outline. The result of this formula displays the time and distance expected for the drive. Internally, it contains more structured data, including a geographic path which can be displayed by the map."
- id: '2018:290'
  name: '42'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "he assigns the name 'route' to the outline node with the route computation, which lets him refer to it from other nodes. He can then write new formulas which use the distance of the route to compute the price based on the cost per kilometer (30 cents) and the fixed daily rate (25 Euros). The formula language has a syntax \`route.distance\` for accessing named children of the mention returned by the formula result."
    - "In most apps, computations like routes only show up in a specified view; in Embark, they return structured data into the outline, which can be displayed in standard ways or repurposed for more custom purposes."
- id: '2018:292'
  name: '43'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "Because the result of the weather forecast formula above is a mention containing structured data, it can be passed into a view and combined with other data. Paul can use a single calendar view to show the hourly precipitation probability from the weather formula alongside the opening hours of the flea market that he manually entered into the outline."
    - "When Paul looks at the calendar, it becomes clear that he and his friends should go to the flea market first because it's less likely to rain in the morning."
    - "if you open Google Calendar and pull up the weather forecast in another tab, there is no way to combine these two data sources in a single view. This is possible in Embark because the weather forecast and the time information live in the same data substrate."
- id: '2018:294'
  name: '44'
  section: Potluck + Embark
  skipped: false
  alt:
  notes: |
    - "A dinner pit stop: Geoffrey was on a road trip to Maine and needed to decide where to stop for dinner. He used the outline view to assess relative drive times, and used the map view to pick a scenic coastal route."
    - "It was helpful to interleave casual notes directly in the document with the rest of our plans."
- id: '2154:1321'
  name: '45'
  section: notion
  skipped: false
  alt:
  notes: |
    Final leg: deploying at scale.
    So until this point I've been showing small scale research prototypes. Sharing demos and essays but not working software.
    I ended up deciding I wanted to go back to startups and build for users again.
    So now I'm at Notion.
    And I want to share a bit about how this all connects there.
- id: '2089:397'
  name: '46'
  section: notion
  skipped: false
  alt:
  notes: |
    A lot of people, when they think about code review, picture a human asking: "Is this code correct?" And "correct" could mean: is it buggy? Does it match the spec I gave it? Or even harder-to-verify things, like: does it have good architecture?

    But fundamentally, this is a thumbs-up / thumbs-down, is-it-correct gate that the human is applying.

    Now, here's the thing. As the agents get smarter, and as we give them better tools, they're getting better and better at asking that question themselves. Over time, the amount of "thumbs down, not correct" the human gives is going to go down and down — the human role in correctness-checking is fading.

    This is not a bad thing, to be clear — having robots that can automatically produce correct output is great.
